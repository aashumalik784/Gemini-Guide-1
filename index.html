<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Aashu Bot 💚</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#0a0a0a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}.chat-container{width:100%;max-width:400px;height:90vh;background:#1a1a1a;border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.header{background:#25D366;padding:15px;text-align:center;font-weight:700;font-size:18px}.messages{flex:1;padding:15px;overflow-y:auto}.msg{margin:8px 0;padding:10px;border-radius:8px;max-width:80%;word-wrap:break-word}.user{background:#25D366;margin-left:auto}.bot{background:#333}.input-area{display:flex;padding:10px;background:#222}input{flex:1;padding:12px;border:none;border-radius:20px;background:#333;color:#fff;outline:none}button{margin-left:8px;padding:12px 16px;border:none;border-radius:20px;background:#25D366;color:#fff;font-weight:700;cursor:pointer}</style></head><body><div class="chat-container"><div class="header">Aashu Bot 💚</div><div class="messages" id="messages"><div class="msg bot">Bhai mai Aashu Bot hu 💚</div></div><div class="input-area"><input type="text" id="userInput" placeholder="Type karo..."><button onclick="sendMessage()">Send</button></div></div><script>const RENDER_URL="https://gemini-guide-api.onrender.com";async function sendMessage(){const e=document.getElementById("userInput"),t=document.getElementById("messages"),n=e.value.trim();if(!n)return;t.innerHTML+=`<div class="msg user">${n}</div>`,e.value="",t.scrollTop=t.scrollHeight;try{const e=await fetch(`${RENDER_URL}/chat`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:n})}),o=await e.json();t.innerHTML+=`<div class="msg bot">${o.reply||o.text||o.response||"Reply mil gaya 💚"}</div>`}catch(e){console.log(e),t.innerHTML+=`<div class="msg bot">Bhai server down hai. Render check kar 💚</div>`}t.scrollTop=t.scrollHeight}document.getElementById("userInput").addEventListener("keypress",e=>{"Enter"===e.key&&sendMessage()});</script></body></html>
