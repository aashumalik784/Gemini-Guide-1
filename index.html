<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aashu Bot 💚</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #0a0a0a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .chat-container { width: 100%; max-width: 400px; height: 90vh; background: #1a1a1a; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 20px rgba(37, 211, 102, 0.2); }
    .header { background: #25D366; padding: 16px; text-align: center; font-weight: 700; font-size: 18px; color: #000; }
    .messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { padding: 10px 14px; border-radius: 12px; max-width: 80%; word-wrap: break-word; line-height: 1.4; }
    .user { background: #25D366; color: #000; align-self: flex-end; border-bottom-right-radius: 4px; }
    .bot { background: #333; align-self: flex-start; border-bottom-left-radius: 4px; }
    .input-area { display: flex; padding: 12px; background: #222; gap: 8px; }
    input { flex: 1; padding: 12px 16px; border: none; border-radius: 24px; background: #333; color: #fff; outline: none; font-size: 15px; }
    button { padding: 12px 18px; border: none; border-radius: 24px; background: #25D366; color: #000; font-weight: 700; cursor: pointer; }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">Aashu Bot 💚</div>
    <div class="messages" id="messages">
      <div class="msg bot">Bhai mai Aashu Bot hu 💚 Kuch puchhna hai?</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Type karo..." autocomplete="off">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const RENDER_URL = "https://gemini-guide-api.onrender.com";
    
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const messages = document.getElementById("messages");
      const text = input.value.trim();
      if (!text) return;
      
      messages.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = "";
      messages.scrollTop = messages.scrollHeight;
      
      try {
        const res = await fetch(`${RENDER_URL}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        const reply = data.reply || data.text || data.response || "Reply mil gaya 💚";
        messages.innerHTML += `<div class="msg bot">${reply}</div>`;
      } catch (err) {
        messages.innerHTML += `<div class="msg bot">Bhai server down hai 💚 30 sec baad try kar</div>`;
      }
      messages.scrollTop = messages.scrollHeight;
    }
    
    document.getElementById("userInput").addEventListener("keypress", e => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
