kind = "web"
previewPath = "/"
title = "Gemini Chat"
version = "1.0.0"
id = "artifacts/gemini-chat"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25167

[services.development]
run = "pnpm --filter @workspace/gemini-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gemini-chat", "run", "build" ]
publicDir = "artifacts/gemini-chat/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25167"
BASE_PATH = "/"
